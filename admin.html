<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - Miss Club Model SA</title>
<style>
  :root {
    --gold: #c9a84c;
    --gold-light: #f0d878;
    --gold-dark: #8b6914;
    --black: #0a0a0a;
    --dark: #1a1a1a;
    --cream: #f5f0e8;
    --red: #e74c3c;
    --green: #27ae60;
    --orange: #f39c12;
    --blue: #3498db;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Georgia', serif;
    background: var(--black);
    color: var(--cream);
    line-height: 1.6;
    min-height: 100vh;
  }
  /* NAV */
  nav {
    position: fixed; top: 0; width: 100%; z-index: 1000;
    background: rgba(10,10,10,0.95);
    border-bottom: 2px solid var(--gold);
    padding: 15px 40px;
    display: flex; justify-content: space-between; align-items: center;
  }
  nav .logo-text { font-size: 1.4rem; color: var(--gold); font-weight: bold; letter-spacing: 2px; }
  nav a { color: var(--cream); text-decoration: none; font-size: 0.95rem; transition: color 0.3s; margin-left: 20px; }
  nav a:hover { color: var(--gold); }
  .btn-logout {
    background: var(--red); color: var(--cream); border: none; padding: 8px 16px;
    border-radius: 4px; cursor: pointer; font-family: inherit;
  }
  .btn-logout:hover { background: #c0392b; }

  /* MAIN */
  main { padding: 100px 40px 60px; max-width: 1400px; margin: 0 auto; }
  h1 { color: var(--gold); margin-bottom: 30px; letter-spacing: 2px; }
  h1::after { content: ''; display: block; width: 80px; height: 3px; background: var(--gold); margin: 15px 0 0; }

  /* TABS */
  .tabs { display: flex; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; border-bottom: 2px solid var(--gold-dark); padding-bottom: 10px; }
  .tab-btn {
    padding: 12px 24px; background: var(--dark); border: 1px solid var(--gold-dark);
    border-radius: 6px 6px 0 0; color: var(--cream); font-family: inherit; font-size: 0.95rem;
    cursor: pointer; transition: all 0.3s;
  }
  .tab-btn:hover { border-color: var(--gold); }
  .tab-btn.active { background: var(--gold); color: var(--black); border-color: var(--gold); }

  /* STATS */
  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 40px; }
  .stat-card { background: var(--dark); border: 1px solid var(--gold-dark); border-radius: 8px; padding: 25px; text-align: center; }
  .stat-card h3 { color: var(--gold); font-size: 2.5rem; margin-bottom: 5px; }
  .stat-card p { color: #aaa; font-size: 0.9rem; }

  /* FILTERS */
  .filters { display: flex; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; align-items: center; }
  .filter-select, .filter-input {
    padding: 10px 15px; background: var(--dark); border: 1px solid var(--gold-dark);
    border-radius: 6px; color: var(--cream); font-family: inherit; font-size: 0.95rem;
  }
  .filter-select:focus, .filter-input:focus { outline: none; border-color: var(--gold); }

  /* TABLE */
  .table-container { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; background: var(--dark); border: 1px solid var(--gold-dark); border-radius: 8px; overflow: hidden; }
  th, td { padding: 15px; text-align: left; border-bottom: 1px solid var(--gold-dark); }
  th { background: var(--black); color: var(--gold); font-weight: bold; letter-spacing: 1px; font-size: 0.85rem; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(201,168,76,0.05); }
  .status-badge {
    display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; text-transform: uppercase;
  }
  .status-undecided { background: var(--orange); color: var(--black); }
  .status-approved { background: var(--green); color: var(--black); }
  .status-declined { background: var(--red); color: var(--cream); }
  .status-deleted { background: #555; color: #aaa; text-decoration: line-through; }
  .status-pending { background: var(--blue); color: var(--cream); }
  .action-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .action-btn { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.8rem; font-weight: bold; transition: all 0.2s; }
  .btn-approve { background: var(--green); color: var(--black); }
  .btn-decline { background: var(--orange); color: var(--black); }
  .btn-delete { background: var(--red); color: var(--cream); }
  .btn-view { background: var(--blue); color: var(--cream); }
  .action-btn:hover { opacity: 0.8; transform: translateY(-1px); }
  .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .applicant-name { font-weight: bold; color: var(--gold); }
  .applicant-email { color: #aaa; font-size: 0.85rem; }
  .applicant-platform { max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #ccc; font-size: 0.85rem; }
  .media-links a { color: var(--gold-light); text-decoration: none; margin-right: 10px; font-size: 0.8rem; }
  .media-links a:hover { text-decoration: underline; }
  .date-col { color: #888; font-size: 0.8rem; white-space: nowrap; }
  .event-col { color: var(--gold-light); font-size: 0.85rem; }

  /* LOGIN */
  .login-container { max-width: 400px; margin: 80px auto; padding: 40px; background: var(--dark); border: 1px solid var(--gold-dark); border-radius: 12px; text-align: center; }
  .login-container h2 { color: var(--gold); margin-bottom: 10px; }
  .login-container p { color: #aaa; margin-bottom: 30px; }
  .form-group { margin-bottom: 20px; text-align: left; }
  .form-group label { display: block; color: var(--gold); margin-bottom: 6px; font-size: 0.95rem; font-weight: bold; }
  .form-group input { width: 100%; padding: 12px 15px; background: var(--black); border: 1px solid #444; color: var(--cream); border-radius: 6px; font-size: 1rem; font-family: 'Georgia', serif; }
  .form-group input:focus { outline: none; border-color: var(--gold); }
  .login-btn { width: 100%; padding: 14px; background: var(--gold); color: var(--black); border: none; border-radius: 6px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: all 0.3s; }
  .login-btn:hover { background: var(--gold-light); }
  .error-msg { color: var(--red); margin-top: 15px; display: none; }
  .error-msg.show { display: block; }

  /* MODAL */
  .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; align-items: center; justify-content: center; }
  .modal.show { display: flex; }
  .modal-content { background: var(--dark); border: 2px solid var(--gold); border-radius: 12px; padding: 30px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; }
  .modal-content h3 { color: var(--gold); margin-bottom: 20px; }
  .modal-row { display: grid; grid-template-columns: 150px 1fr; gap: 10px; margin-bottom: 12px; font-size: 0.9rem; }
  .modal-label { color: var(--gold); font-weight: bold; }
  .modal-value { color: #ccc; word-break: break-word; }
  .modal-media a { display: inline-block; margin: 5px 10px 5px 0; color: var(--gold-light); text-decoration: none; font-size: 0.85rem; }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }
  .modal-close { background: transparent; color: var(--cream); border: 1px solid var(--gold-dark); padding: 10px 20px; border-radius: 4px; cursor: pointer; }

  /* RESPONSIVE */
  @media (max-width: 768px) {
    nav { padding: 15px 20px; }
    main { padding: 100px 20px 40px; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    th, td { padding: 10px 8px; font-size: 0.8rem; }
    .action-btns { flex-direction: column; }
    .modal-row { grid-template-columns: 1fr; }
    .modal-label { border-bottom: 1px solid var(--gold-dark); padding-bottom: 5px; margin-bottom: 5px; }
    .tabs { justify-content: center; }
  }
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <div class="logo-text">Miss Club Model SA - Admin</div>
  <div>
    <a href="/">View Site</a>
    <button class="btn-logout" id="logoutBtn" style="display:none">Logout</button>
  </div>
</nav>

<!-- LOGIN VIEW -->
<div id="loginView" class="login-container">
  <h2>Admin Login</h2>
  <p>Sign in to manage all data</p>
  <form id="loginForm">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="loginEmail" required placeholder="admin@missclubmodelsa.co.za">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPassword" required placeholder="••••••••">
    </div>
    <button type="submit" class="login-btn">Sign In</button>
    <div class="error-msg" id="loginError"></div>
  </form>
</div>

<!-- DASHBOARD VIEW (hidden until login) -->
<div id="dashboardView" style="display:none">
  <h1>Admin Dashboard</h1>

  <!-- TABS -->
  <div class="tabs" id="tabs">
    <button class="tab-btn active" data-table="applications">Candidate Applications</button>
    <button class="tab-btn" data-table="interested_parties">Event Registrations</button>
    <button class="tab-btn" data-table="event_organizers">Venue Partners</button>
    <button class="tab-btn" data-table="events">Events</button>
  </div>

  <!-- STATS -->
  <div class="stats-grid" id="statsGrid">
    <div class="stat-card"><h3 id="statTotal">0</h3><p>Total</p></div>
    <div class="stat-card"><h3 id="statUndecided">0</h3><p>Pending</p></div>
    <div class="stat-card"><h3 id="statApproved">0</h3><p>Approved</p></div>
    <div class="stat-card"><h3 id="statDeclined">0</h3><p>Declined</p></div>
  </div>

  <!-- FILTERS -->
  <div class="filters" id="filters">
    <select class="filter-select" id="statusFilter">
      <option value="">All Statuses</option>
      <option value="undecided">Undecided</option>
      <option value="approved">Approved</option>
      <option value="declined">Declined</option>
      <option value="deleted">Deleted</option>
      <option value="pending">Pending</option>
    </select>
    <input type="text" class="filter-input" id="searchInput" placeholder="Search...">
    <select class="filter-select" id="sortSelect">
      <option value="newest">Newest First</option>
      <option value="oldest">Oldest First</option>
      <option value="name">Name A-Z</option>
    </select>
  </div>

  <!-- TABLE -->
  <div class="table-container">
    <table>
      <thead id="tableHead">
        <tr>
          <th>Applicant</th>
          <th>Platform / Advocacy</th>
          <th>Status</th>
          <th>Media</th>
          <th>Date</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="tableBody">
      </tbody>
    </table>
  </div>
</div>

<!-- DETAIL MODAL -->
<div class="modal" id="detailModal">
  <div class="modal-content">
    <h3>Record Details</h3>
    <div id="modalBody"></div>
    <div class="modal-actions">
      <button class="modal-close" id="modalClose">Close</button>
    </div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://ekvwgxnryasrvltyukvj.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_ePDDXlwk-BhljlqNhink-w_ZEzsJ6ZR';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Admin emails allowed
const ADMIN_EMAILS = ['elihsa@gmail.com', 'admin@missclubmodelsa.co.za', 'kiyanoschoonraad98@gmail.com'];

let allRecords = [];
let currentTable = 'applications';

// Table configurations
const tableConfigs = {
  applications: {
    title: 'Candidate Applications',
    columns: ['applicant', 'platform', 'status', 'media', 'date', 'actions'],
    headers: ['Applicant', 'Platform / Advocacy', 'Status', 'Media', 'Date', 'Actions'],
    stats: ['total', 'undecided', 'approved', 'declined'],
    statusOptions: ['undecided', 'approved', 'declined', 'deleted']
  },
  interested_parties: {
    title: 'Event Registrations',
    columns: ['applicant', 'event', 'email', 'status', 'date', 'actions'],
    headers: ['Applicant', 'Event', 'Email', 'Status', 'Date', 'Actions'],
    stats: ['total', 'pending'],
    statusOptions: ['pending']
  },
  event_organizers: {
    title: 'Venue Partners',
    columns: ['applicant', 'venue', 'email', 'status', 'date', 'actions'],
    headers: ['Contact', 'Venue', 'Email', 'Status', 'Date', 'Actions'],
    stats: ['total', 'pending', 'approved', 'declined'],
    statusOptions: ['pending', 'approved', 'declined']
  },
  events: {
    title: 'Events',
    columns: ['name', 'date', 'location', 'status', 'actions'],
    headers: ['Event Name', 'Date', 'Location', 'Status', 'Actions'],
    stats: ['total'],
    statusOptions: []
  }
};

const loginView = document.getElementById('loginView');
const dashboardView = document.getElementById('dashboardView');
const logoutBtn = document.getElementById('logoutBtn');
const loginForm = document.getElementById('loginForm');
const loginError = document.getElementById('loginError');
const tabsContainer = document.getElementById('tabs');
const statsGrid = document.getElementById('statsGrid');
const filters = document.getElementById('filters');
const tableHead = document.getElementById('tableHead');
const tableBody = document.getElementById('tableBody');
const statusFilter = document.getElementById('statusFilter');
const searchInput = document.getElementById('searchInput');
const sortSelect = document.getElementById('sortSelect');
const detailModal = document.getElementById('detailModal');
const modalBody = document.getElementById('modalBody');
const modalClose = document.getElementById('modalClose');

// Check session on load
async function checkSession() {
  const { data: { session } } = await supabase.auth.getSession();
  if (session && ADMIN_EMAILS.includes(session.user.email)) {
    showDashboard();
    loadData();
  } else {
    showLogin();
  }
}

// Auth state listener
supabase.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_IN' && session && ADMIN_EMAILS.includes(session.user.email)) {
    showDashboard();
    loadData();
  } else if (event === 'SIGNED_OUT') {
    showLogin();
  }
});

// Login
loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;

  if (!ADMIN_EMAILS.includes(email)) {
    loginError.textContent = 'Unauthorized email';
    loginError.classList.add('show');
    return;
  }

  const { error } = await supabase.auth.signInWithPassword({ email, password });
  if (error) {
    loginError.textContent = error.message;
    loginError.classList.add('show');
  } else {
    loginError.classList.remove('show');
  }
});

// Logout
logoutBtn.addEventListener('click', async () => {
  await supabase.auth.signOut();
  showLogin();
});

function showLogin() {
  loginView.style.display = 'block';
  dashboardView.style.display = 'none';
  logoutBtn.style.display = 'none';
}

function showDashboard() {
  loginView.style.display = 'none';
  dashboardView.style.display = 'block';
  logoutBtn.style.display = 'block';
}

// Tab switching
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTable = btn.dataset.table;
    loadData();
  });
});

// Load data based on current table
async function loadData() {
  const config = tableConfigs[currentTable];
  document.title = `Admin - ${config.title} - Miss Club Model SA`;

  // Update filters
  updateFilters(config);

  // Load records
  const { data, error } = await supabase
    .from(currentTable)
    .select('*')
    .order('created_at', { ascending: false });

  if (error) {
    console.error('Load error:', error);
    return;
  }

  allRecords = data || [];
  updateStats();
  renderTable();
}

function updateFilters(config) {
  // Update status filter
  statusFilter.innerHTML = '<option value="">All Statuses</option>';
  config.statusOptions.forEach(status => {
    const opt = document.createElement('option');
    opt.value = status;
    opt.textContent = status.charAt(0).toUpperCase() + status.slice(1);
    statusFilter.appendChild(opt);
  });

  // Update table headers
  tableHead.innerHTML = '<tr>' + config.headers.map(h => `<th>${h}</th>`).join('') + '</tr>';
}

function updateStats() {
  const config = tableConfigs[currentTable];
  const stats = { total: 0, undecided: 0, approved: 0, declined: 0, deleted: 0, pending: 0 };
  
  allRecords.forEach(record => {
    stats.total++;
    const status = record.status || 'undecided';
    if (stats[status] !== undefined) stats[status]++;
  });

  // Update stat cards based on current table
  const statCards = statsGrid.querySelectorAll('.stat-card');
  if (currentTable === 'applications') {
    statCards[0].querySelector('h3').textContent = stats.total;
    statCards[0].querySelector('p').textContent = 'Total';
    statCards[1].querySelector('h3').textContent = stats.undecided;
    statCards[1].querySelector('p').textContent = 'Undecided';
    statCards[2].querySelector('h3').textContent = stats.approved;
    statCards[2].querySelector('p').textContent = 'Approved';
    statCards[3].querySelector('h3').textContent = stats.declined;
    statCards[3].querySelector('p').textContent = 'Declined';
  } else if (currentTable === 'interested_parties') {
    statCards[0].querySelector('h3').textContent = stats.total;
    statCards[0].querySelector('p').textContent = 'Total Registrations';
    statCards[1].querySelector('h3').textContent = stats.pending;
    statCards[1].querySelector('p').textContent = 'Pending';
    statCards[2].style.display = 'none';
    statCards[3].style.display = 'none';
  } else if (currentTable === 'event_organizers') {
    statCards[0].querySelector('h3').textContent = stats.total;
    statCards[0].querySelector('p').textContent = 'Total Applications';
    statCards[1].querySelector('h3').textContent = stats.pending;
    statCards[1].querySelector('p').textContent = 'Pending';
    statCards[2].querySelector('h3').textContent = stats.approved;
    statCards[2].querySelector('p').textContent = 'Approved';
    statCards[3].querySelector('h3').textContent = stats.declined;
    statCards[3].querySelector('p').textContent = 'Declined';
    statCards[2].style.display = 'block';
    statCards[3].style.display = 'block';
  } else if (currentTable === 'events') {
    statCards[0].querySelector('h3').textContent = stats.total;
    statCards[0].querySelector('p').textContent = 'Total Events';
    statCards[1].style.display = 'none';
    statCards[2].style.display = 'none';
    statCards[3].style.display = 'none';
  }
}

function renderTable() {
  const config = tableConfigs[currentTable];
  let filtered = [...allRecords];

  // Status filter
  const statusVal = statusFilter.value;
  if (statusVal) filtered = filtered.filter(r => (r.status || 'undecided') === statusVal);

  // Search
  const searchVal = searchInput.value.toLowerCase();
  if (searchVal) {
    filtered = filtered.filter(r => 
      (r.full_name || r.name || '').toLowerCase().includes(searchVal) ||
      (r.email || '').toLowerCase().includes(searchVal) ||
      (r.platform || r.venue_name || r.location || '').toLowerCase().includes(searchVal)
    );
  }

  // Sort
  const sortVal = sortSelect.value;
  if (sortVal === 'oldest') {
    filtered.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
  } else if (sortVal === 'name') {
    filtered.sort((a, b) => (a.full_name || a.name || '').localeCompare(b.full_name || b.name || ''));
  } else {
    filtered.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  }

  // Render rows
  tableBody.innerHTML = filtered.map(record => {
    const status = record.status || 'undecided';
    const date = record.created_at ? new Date(record.created_at).toLocaleDateString() : 'N/A';
    
    if (currentTable === 'applications') {
      return `
        <tr>
          <td>
            <div class="applicant-name">${record.full_name || 'Unknown'}</div>
            <div class="applicant-email">${record.email || ''}</div>
          </td>
          <td class="applicant-platform">${record.platform || 'N/A'}</td>
          <td><span class="status-badge status-${status}">${status}</span></td>
          <td class="media-links">
            ${record.headshot_url ? `<a href="${record.headshot_url}" target="_blank">Headshot</a>` : ''}
            ${record.fullbody_url ? `<a href="${record.fullbody_url}" target="_blank">Full Body</a>` : ''}
            ${record.video_url ? `<a href="${record.video_url}" target="_blank">Video</a>` : ''}
          </td>
          <td class="date-col">${date}</td>
          <td>
            <div class="action-btns">
              <button class="action-btn btn-view" onclick="viewRecord('${record.id}')">View</button>
              <button class="action-btn btn-approve" onclick="updateStatus('${record.id}', 'approved')" ${status === 'approved' ? 'disabled' : ''}>Approve</button>
              <button class="action-btn btn-decline" onclick="updateStatus('${record.id}', 'declined')" ${status === 'declined' ? 'disabled' : ''}>Decline</button>
              <button class="action-btn btn-delete" onclick="updateStatus('${record.id}', 'deleted')" ${status === 'deleted' ? 'disabled' : ''}>Delete</button>
            </div>
          </td>
        </tr>
      `;
    } else if (currentTable === 'interested_parties') {
      return `
        <tr>
          <td>
            <div class="applicant-name">${record.full_name || 'Unknown'}</div>
            <div class="applicant-email">${record.email || ''}</div>
          </td>
          <td class="event-col">${record.event_id || 'N/A'}</td>
          <td>${record.email || ''}</td>
          <td><span class="status-badge status-${status}">${status || 'pending'}</span></td>
          <td class="date-col">${date}</td>
          <td>
            <div class="action-btns">
              <button class="action-btn btn-view" onclick="viewRecord('${record.id}')">View</button>
            </div>
          </td>
        </tr>
      `;
    } else if (currentTable === 'event_organizers') {
      return `
        <tr>
          <td>
            <div class="applicant-name">${record.full_name || 'Unknown'}</div>
            <div class="applicant-email">${record.email || ''}</div>
          </td>
          <td>
            <div class="applicant-name">${record.venue_name || 'N/A'}</div>
            <div class="applicant-email">${record.venue_location || ''}</div>
          </td>
          <td>${record.email || ''}</td>
          <td><span class="status-badge status-${status}">${status}</span></td>
          <td class="date-col">${date}</td>
          <td>
            <div class="action-btns">
              <button class="action-btn btn-view" onclick="viewRecord('${record.id}')">View</button>
              <button class="action-btn btn-approve" onclick="updateStatus('${record.id}', 'approved')" ${status === 'approved' ? 'disabled' : ''}>Approve</button>
              <button class="action-btn btn-decline" onclick="updateStatus('${record.id}', 'declined')" ${status === 'declined' ? 'disabled' : ''}>Decline</button>
            </div>
          </td>
        </tr>
      `;
    } else if (currentTable === 'events') {
      return `
        <tr>
          <td class="applicant-name">${record.name || 'Untitled Event'}</td>
          <td>${record.event_date || 'N/A'}</td>
          <td>${record.location || 'N/A'}</td>
          <td><span class="status-badge">${record.poster_url ? 'Has Poster' : 'No Poster'}</span></td>
          <td class="date-col">${date}</td>
          <td>
            <div class="action-btns">
              <button class="action-btn btn-view" onclick="viewRecord('${record.id}')">View</button>
            </div>
          </td>
        </tr>
      `;
    }
  }).join('');
}

// View record details
async function viewRecord(id) {
  const record = allRecords.find(r => r.id === id);
  if (!record) return;

  let html = '';
  for (const [key, value] of Object.entries(record)) {
    if (value === null || value === undefined) continue;
    if (key === 'headshot_url' || key === 'fullbody_url' || key === 'video_url' || key === 'poster_url') {
      html += `<div class="modal-row"><span class="modal-label">${key}</span><span class="modal-value"><a href="${value}" target="_blank">${value}</a></span></div>`;
    } else {
      html += `<div class="modal-row"><span class="modal-label">${key}</span><span class="modal-value">${value}</span></div>`;
    }
  }
  modalBody.innerHTML = html;
  detailModal.classList.add('show');
}

modalClose.addEventListener('click', () => detailModal.classList.remove('show'));
detailModal.addEventListener('click', (e) => { if (e.target === detailModal) detailModal.classList.remove('show'); });

// Update status
async function updateStatus(id, newStatus) {
  const { error } = await supabase
    .from(currentTable)
    .update({ status: newStatus })
    .eq('id', id);

  if (error) {
    alert('Error updating status: ' + error.message);
  } else {
    loadData();
  }
}

// Filters
statusFilter.addEventListener('change', renderTable);
searchInput.addEventListener('input', renderTable);
sortSelect.addEventListener('change', renderTable);

// Initialize
checkSession();
</script>
</body>
