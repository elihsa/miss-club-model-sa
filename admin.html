<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - Miss Club Model SA</style>
<style>
  :root {
    --gold: #c9a84c;
    --gold-light: #f0d878;
    --gold-dark: #8b6914;
    --black: #0a0a0a;
    --dark: #1a1a1a;
    --cream: #f5f0e8;
    --red: #e74c3c;
    --green: #27ae60;
    --orange: #f39c12;
    --blue: #3498db;
    --gray: #666;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Playfair Display', Georgia, serif;
    background: var(--black);
    color: var(--cream);
    line-height: 1.6;
    min-height: 100vh;
  }
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap');
  body { font-family: 'Inter', sans-serif; }
  h1, h2, h3, .logo-text, .stat-card h3 { font-family: 'Playfair Display', serif; }

  /* NAV */
  nav {
    position: fixed; top: 0; width: 100%; z-index: 1000;
    background: rgba(10,10,10,0.98);
    border-bottom: 2px solid var(--gold);
    padding: 15px 40px;
    display: flex; justify-content: space-between; align-items: center;
  }
  nav .logo-text { font-size: 1.3rem; color: var(--gold); font-weight: 600; letter-spacing: 2px; }
  nav a { color: var(--cream); text-decoration: none; font-size: 0.9rem; transition: color 0.3s; margin-left: 20px; }
  nav a:hover { color: var(--gold); }
  .btn-logout {
    background: var(--red); color: var(--cream); border: none; padding: 8px 16px;
    border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 0.85rem;
  }
  .btn-logout:hover { background: #c0392b; }

  /* MAIN */
  main { padding: 100px 40px 60px; max-width: 1600px; margin: 0 auto; }
  .page-header {
    display: flex; justify-content: space-between; align-items: flex-end;
    margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid var(--gold-dark);
  }
  h1 { color: var(--gold); letter-spacing: 2px; font-size: 2rem; }
  h1::after { content: ''; display: block; width: 80px; height: 3px; background: var(--gold); margin: 15px 0 0; }

  /* TABS */
  .tabs { display: flex; gap: 8px; margin-bottom: 30px; flex-wrap: wrap; border-bottom: 2px solid var(--gold-dark); padding-bottom: 10px; }
  .tab-btn {
    padding: 12px 24px; background: var(--dark); border: 1px solid var(--gold-dark);
    border-radius: 6px 6px 0 0; color: var(--cream); font-family: inherit; font-size: 0.9rem;
    cursor: pointer; transition: all 0.3s;
  }
  .tab-btn:hover { border-color: var(--gold); }
  .tab-btn.active { background: var(--gold); color: var(--black); border-color: var(--gold); }

  /* STATS */
  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
  .stat-card { background: var(--dark); border: 1px solid var(--gold-dark); border-radius: 8px; padding: 25px; text-align: center; transition: transform 0.2s, border-color 0.2s; }
  .stat-card:hover { transform: translateY(-2px); border-color: var(--gold); }
  .stat-card h3 { color: var(--gold); font-size: 2.5rem; margin-bottom: 5px; }
  .stat-card p { color: #aaa; font-size: 0.9rem; }

  /* TOOLBAR */
  .toolbar { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
  .toolbar-left { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .toolbar-right { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; }
  .filter-select, .filter-input, .column-select {
    padding: 10px 15px; background: var(--dark); border: 1px solid var(--gold-dark);
    border-radius: 6px; color: var(--cream); font-family: inherit; font-size: 0.85rem; min-width: 160px;
  }
  .filter-select:focus, .filter-input:focus, .column-select:focus { outline: none; border-color: var(--gold); }
  .btn-primary {
    background: var(--gold); color: var(--black); border: none; padding: 12px 24px;
    border-radius: 6px; cursor: pointer; font-family: 'Playfair Display', serif; font-size: 1rem; font-weight: 600;
    transition: all 0.3s;
  }
  .btn-primary:hover { background: var(--gold-light); transform: translateY(-1px); }
  .btn-secondary {
    background: var(--dark); color: var(--cream); border: 1px solid var(--gold-dark);
    padding: 10px 20px; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 0.85rem;
    transition: all 0.3s;
  }
  .btn-secondary:hover { border-color: var(--gold); }

  /* TABLE */
  .table-container { overflow-x: auto; border-radius: 8px; border: 1px solid var(--gold-dark); }
  table { width: 100%; border-collapse: collapse; background: var(--dark); }
  th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid var(--gold-dark); }
  th {
    background: var(--black); color: var(--gold); font-weight: 600; letter-spacing: 1px; font-size: 0.8rem;
    white-space: nowrap; position: sticky; top: 0; z-index: 10;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(201,168,76,0.05); }
  .status-badge {
    display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
  }
  .status-undecided { background: var(--orange); color: var(--black); }
  .status-approved { background: var(--green); color: var(--black); }
  .status-declined { background: var(--red); color: var(--cream); }
  .status-deleted { background: #555; color: #aaa; text-decoration: line-through; }
  .status-pending { background: var(--blue); color: var(--cream); }
  .action-btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .action-btn { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.75rem; font-weight: 600; transition: all 0.2s; }
  .btn-approve { background: var(--green); color: var(--black); }
  .btn-decline { background: var(--orange); color: var(--black); }
  .btn-delete { background: var(--red); color: var(--cream); }
  .btn-view { background: var(--blue); color: var(--cream); }
  .btn-edit { background: var(--gold); color: var(--black); }
  .action-btn:hover { opacity: 0.85; transform: translateY(-1px); }
  .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .applicant-name { font-weight: 600; color: var(--gold); font-size: 0.9rem; }
  .applicant-email { color: #888; font-size: 0.8rem; }
  .applicant-platform { max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #aaa; font-size: 0.8rem; }
  .media-thumb {
    width: 48px; height: 48px; object-fit: cover; border-radius: 4px;
    border: 1px solid var(--gold-dark); cursor: pointer; transition: transform 0.2s;
  }
  .media-thumb:hover { transform: scale(1.5); z-index: 100; position: relative; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
  .media-links a { color: var(--gold-light); text-decoration: none; margin-right: 10px; font-size: 0.75rem; }
  .media-links a:hover { text-decoration: underline; }
  .date-col { color: #777; font-size: 0.8rem; white-space: nowrap; }
  .event-col { color: var(--gold-light); font-size: 0.85rem; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .poster-thumb {
    width: 60px; height: 40px; object-fit: cover; border-radius: 4px;
    border: 1px solid var(--gold-dark); cursor: pointer; transition: transform 0.2s;
  }
  .poster-thumb:hover { transform: scale(2); z-index: 100; position: relative; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
  .empty-cell { color: #555; font-style: italic; font-size: 0.8rem; }

  /* LOGIN */
  .login-container { max-width: 420px; margin: 80px auto; padding: 50px 40px; background: var(--dark); border: 1px solid var(--gold-dark); border-radius: 12px; text-align: center; }
  .login-container h2 { color: var(--gold); margin-bottom: 10px; font-size: 1.8rem; }
  .login-container p { color: #aaa; margin-bottom: 30px; }
  .form-group { margin-bottom: 20px; text-align: left; }
  .form-group label { display: block; color: var(--gold); margin-bottom: 6px; font-size: 0.9rem; font-weight: 600; }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 12px 15px; background: var(--black); border: 1px solid #444; color: var(--cream); border-radius: 6px; font-size: 1rem; font-family: inherit;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--gold); }
  .login-btn { width: 100%; padding: 14px; background: var(--gold); color: var(--black); border: none; border-radius: 6px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: all 0.3s; }
  .login-btn:hover { background: var(--gold-light); }
  .error-msg { color: var(--red); margin-top: 15px; display: none; }
  .error-msg.show { display: block; }

  /* MODAL */
  .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; align-items: center; justify-content: center; padding: 20px; }
  .modal.show { display: flex; }
  .modal-content { background: var(--dark); border: 2px solid var(--gold); border-radius: 12px; padding: 30px; max-width: 800px; width: 100%; max-height: 85vh; overflow-y: auto; position: relative; }
  .modal-content h3 { color: var(--gold); margin-bottom: 20px; font-size: 1.5rem; }
  .modal-row { display: grid; grid-template-columns: 180px 1fr; gap: 12px; margin-bottom: 14px; font-size: 0.9rem; }
  .modal-label { color: var(--gold); font-weight: 600; }
  .modal-value { color: #ddd; word-break: break-word; }
  .modal-value a { color: var(--gold-light); }
  .modal-media { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
  .modal-media img, .modal-media video { width: 120px; height: 120px; object-fit: cover; border-radius: 8px; border: 1px solid var(--gold-dark); }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; flex-wrap: wrap; }
  .modal-close { background: transparent; color: var(--cream); border: 1px solid var(--gold-dark); padding: 10px 20px; border-radius: 4px; cursor: pointer; transition: all 0.2s; }
  .modal-close:hover { border-color: var(--gold); color: var(--gold); }

  /* DETAIL MODAL (Candidate) */
  .detail-modal { max-width: 1000px; }
  .detail-header { display: flex; gap: 30px; margin-bottom: 30px; flex-wrap: wrap; }
  .detail-avatar { width: 150px; height: 150px; object-fit: cover; border-radius: 8px; border: 2px solid var(--gold); flex-shrink: 0; }
  .detail-info h3 { color: var(--gold); font-size: 1.8rem; margin-bottom: 5px; }
  .detail-info .detail-email { color: var(--gold-light); margin-bottom: 15px; }
  .detail-info .detail-platform { color: #ccc; line-height: 1.8; }
  .detail-carousel { position: relative; margin-bottom: 30px; }
  .carousel-track { display: flex; gap: 15px; overflow-x: auto; padding: 10px 5px; scroll-snap-type: x mandatory; }
  .carousel-track::-webkit-scrollbar { height: 6px; }
  .carousel-track::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 3px; }
  .carousel-item { flex: 0 0 auto; width: 280px; scroll-snap-align: start; }
  .carousel-item img, .carousel-item video { width: 100%; border-radius: 8px; border: 1px solid var(--gold-dark); cursor: pointer; transition: transform 0.2s; }
  .carousel-item img:hover, .carousel-item video:hover { transform: scale(1.02); }
  .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
  .detail-field { background: var(--black); border: 1px solid var(--gold-dark); border-radius: 8px; padding: 20px; }
  .detail-field label { color: var(--gold); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; display: block; }
  .detail-field span { color: #ddd; word-break: break-word; }

  /* EDIT MODAL */
  .edit-modal { max-width: 700px; }
  .edit-form .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .edit-form .form-group.full-width { grid-column: 1 / -1; }
  .edit-form .form-group label { color: var(--gold); font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; display: block; }
  .edit-form .form-group input, .edit-form .form-group select, .edit-form .form-group textarea {
    width: 100%; padding: 10px 14px; background: var(--black); border: 1px solid #444; color: var(--cream); border-radius: 6px; font-size: 0.95rem; font-family: inherit;
  }
  .edit-form .form-group input:focus, .edit-form .form-group select:focus, .edit-form .form-group textarea:focus { outline: none; border-color: var(--gold); }
  .media-preview { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .media-preview img { width: 80px; height: 80px; object-fit: cover; border-radius: 6px; border: 1px solid var(--gold-dark); }

  /* EVENT CREATION MODAL */
  .event-form .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .event-form .form-group.full-width { grid-column: 1 / -1; }

  /* COLUMN SELECTOR MODAL */
  .column-modal { max-width: 500px; }
  .column-list { display: flex; flex-direction: column; gap: 10px; max-height: 400px; overflow-y: auto; }
  .column-item { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--black); border: 1px solid var(--gold-dark); border-radius: 6px; cursor: pointer; transition: all 0.2s; }
  .column-item:hover { border-color: var(--gold); }
  .column-item input { width: 18px; height: 18px; accent-color: var(--gold); }
  .column-item label { color: var(--cream); font-size: 0.9rem; cursor: pointer; flex: 1; }
  .column-item .drag-handle { color: var(--gold); cursor: grab; }

  /* RESPONSIVE */
  @media (max-width: 768px) {
    nav { padding: 15px 20px; }
    main { padding: 100px 20px 40px; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    th, td { padding: 10px 8px; font-size: 0.8rem; }
    .action-btns { flex-direction: column; }
    .modal-row { grid-template-columns: 1fr; }
    .modal-label { border-bottom: 1px solid var(--gold-dark); padding-bottom: 5px; margin-bottom: 5px; }
    .tabs { justify-content: center; }
    .page-header { flex-direction: column; align-items: flex-start; gap: 15px; }
    .toolbar { flex-direction: column; align-items: stretch; }
    .toolbar-right { margin-left: 0; justify-content: flex-start; }
    .edit-form .form-row, .event-form .form-row { grid-template-columns: 1fr; }
    .detail-header { flex-direction: column; }
    .detail-avatar { width: 100%; height: 200px; }
  }
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <div class="logo-text">Miss Club Model SA - Admin</div>
  <div>
    <a href="/">View Site</a>
    <button class="btn-logout" id="logoutBtn" style="display:none">Logout</button>
  </div>
</nav>

<!-- LOGIN VIEW -->
<div id="loginView" class="login-container" style="display: block">
  <h2>Admin Login</h2>
  <p>Sign in to manage all data</p>
  <form id="loginForm">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="loginEmail" required placeholder="admin@missclubmodelsa.co.za">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPassword" required placeholder="••••••••">
    </div>
    <button type="submit" class="login-btn">Sign In</button>
    <div class="error-msg" id="loginError"></div>
  </form>
</div>

<!-- DASHBOARD VIEW -->
<div id="dashboardView" style="display:none">
  <div class="page-header">
    <h1 id="pageTitle">Admin Dashboard</h1>
    <div class="toolbar-right">
      <button class="btn-primary" id="createEventBtn" style="display:none">+ Create Event</button>
      <button class="btn-secondary" id="columnConfigBtn">Columns</button>
    </div>
  </div>

  <!-- TABS -->
  <div class="tabs" id="tabs">
    <button class="tab-btn active" data-table="applications">Candidate Applications</button>
    <button class="tab-btn" data-table="interested_parties">Event Registrations</button>
    <button class="tab-btn" data-table="event_organizers">Venue Partners</button>
    <button class="tab-btn" data-table="events">Events</button>
    <button class="tab-btn" data-table="event_interest_subscriptions">Event Interest List</button>
    <button class="tab-btn" data-table="email_settings">Email Settings</button>
  </div>

  <!-- STATS -->
  <div class="stats-grid" id="statsGrid">
    <div class="stat-card"><h3 id="statTotal">0</h3><p>Total</p></div>
    <div class="stat-card"><h3 id="statUndecided">0</h3><p>Pending</p></div>
    <div class="stat-card"><h3 id="statApproved">0</h3><p>Approved</p></div>
    <div class="stat-card"><h3 id="statDeclined">0</h3><p>Declined</p></div>
  </div>

  <!-- TOOLBAR -->
  <div class="toolbar">
    <div class="toolbar-left">
      <select class="filter-select" id="statusFilter"><option value="">All Statuses</option></select>
      <input type="text" class="filter-input" id="searchInput" placeholder="Search...">
      <select class="filter-select" id="sortSelect">
        <option value="newest">Newest First</option>
        <option value="oldest">Oldest First</option>
        <option value="name">Name A-Z</option>
      </select>
    </div>
  </div>

  <!-- TABLE -->
  <div class="table-container">
    <table>
      <thead id="tableHead">
        <tr>
          <th>Applicant</th>
          <th>Platform / Advocacy</th>
          <th>Status</th>
          <th>Media</th>
          <th>Date</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<!-- DETAIL MODAL (View) -->
<div class="modal" id="detailModal">
  <div class="modal-content detail-modal">
    <h3>Record Details</h3>
    <div id="modalBody"></div>
    <div class="modal-actions">
      <button class="modal-close" id="modalClose">Close</button>
    </div>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="modal" id="editModal">
  <div class="modal-content edit-modal">
    <h3 id="editModalTitle">Edit Record</h3>
    <form class="edit-form" id="editForm">
      <div class="form-row" id="editFormFields"></div>
      <div class="modal-actions">
        <button type="button" class="modal-close" id="editModalClose">Cancel</button>
        <button type="submit" class="btn-primary">Save Changes</button>
      </div>
    </form>
  </div>
</div>

<!-- EVENT CREATION MODAL -->
<div class="modal" id="eventModal">
  <div class="modal-content edit-modal event-form">
    <h3>Create New Event</h3>
    <form id="eventCreationForm">
      <div class="form-row">
        <div class="form-group">
          <label>Event Name *</label>
          <input type="text" name="name" required placeholder="e.g., Miss Club Model SA Gala 2026">
        </div>
        <div class="form-group">
          <label>Event Date *</label>
          <input type="date" name="event_date" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Event Time</label>
          <input type="time" name="event_time">
        </div>
        <div class="form-group">
          <label>Location *</label>
          <input type="text" name="location" required placeholder="e.g., Sun City, South Africa">
        </div>
      </div>
      <div class="form-group full-width">
        <label>Description</label>
        <textarea name="description" rows="4" placeholder="Describe the event, schedule, highlights, ticket info..."></textarea>
      </div>
      <div class="form-group full-width">
        <label>Poster Image URL</label>
        <input type="text" name="poster_url" placeholder="https://... (or leave empty to upload later)">
        <div class="media-preview" id="posterPreview"></div>
      </div>
      <div class="modal-actions">
        <button type="button" class="modal-close" id="eventModalClose">Cancel</button>
        <button type="submit" class="btn-primary">Create Event</button>
      </div>
    </form>
  </div>
</div>

<!-- COLUMN CONFIGURATION MODAL -->
<div class="modal" id="columnModal">
  <div class="modal-content column-modal">
    <h3>Configure Columns</h3>
    <p style="color:#aaa; margin-bottom:20px; font-size:0.9rem;">Drag to reorder, check/uncheck to show/hide</p>
    <div class="column-list" id="columnList"></div>
    <div class="modal-actions">
      <button class="modal-close" id="columnModalClose">Done</button>
    </div>
  </div>
</div>

// Load column config from localStorage
function loadColumnConfig() {
  const saved = localStorage.getItem('admin_column_config');
  if (saved) columnConfig = JSON.parse(saved);
}
function saveColumnConfig() {
  localStorage.setItem('admin_column_config', JSON.stringify(columnConfig));
}
function getVisibleColumns(table) {
  const config = columnConfig[table] || tableSchemas[table].defaultColumns;
  return config;
}
function setVisibleColumns(table, columns) {
  columnConfig[table] = columns;
  saveColumnConfig();
}

// Check session on load
async function checkSession() {
  try {
    const { data: { session }, error } = await supabase.auth.getSession();
    console.log('checkSession result:', { session: !!session, user: session?.user?.email, error });
    if (session && ADMIN_EMAILS.includes(session.user.email)) {
      showDashboard();
      loadData();
    } else {
      showLogin();
    }
  } catch (err) {
    console.error('checkSession error:', err);
    showLogin(); // Fallback to login on error
  }
}

// Auth state listener
supabase.auth.onAuthStateChange((event, session) => {
  console.log('Auth state change:', event, session?.user?.email);
  if (event === 'SIGNED_IN' && session && ADMIN_EMAILS.includes(session.user.email)) {
    showDashboard();
    loadData();
  } else if (event === 'SIGNED_OUT') {
    showLogin();
  }
});

// Login
loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;

  console.log('Login attempt for:', email);

  if (!ADMIN_EMAILS.includes(email)) {
    loginError.textContent = 'Unauthorized email';
    loginError.classList.add('show');
    return;
  }

  const { data, error } = await supabase.auth.signInWithPassword({ email, password });
  console.log('Login result:', { data: !!data?.user, error });
  if (error) {
    loginError.textContent = error.message;
    loginError.classList.add('show');
  } else {
    loginError.classList.remove('show');
  }
});

// Logout
logoutBtn.addEventListener('click', async () => {
  await supabase.auth.signOut();
  showLogin();
});

function showLogin() {
  loginView.style.display = 'block';

// Load data based on current table
async function loadData() {
  const schema = tableSchemas[currentTable];
  pageTitle.textContent = schema.title;
  document.title = `Admin - ${schema.title} - Miss Club Model SA`;

  // Show/hide create event button
  createEventBtn.style.display = currentTable === 'events' ? 'inline-flex' : 'none';

  // Update filters
  updateFilters(schema);

  // Load records - special handling for email_settings
  if (currentTable === 'email_settings') {
    await loadEmailSettings();
    return;
  }

  const { data, error } = await supabase
    .from(currentTable)
    .select('*')
    .order('created_at', { ascending: false });

  if (error) {
    console.error('Load error:', error);
    return;
  }

  allRecords = data || [];
  updateStats();
  renderTable();
  renderColumnConfig();
}

async function loadEmailSettings() {
  try {
    const { data, error } = await supabase
      .from('site_settings')
      .select('value')
      .eq('key', 'email_settings')
      .single();

    if (error || !data) {
      // Use defaults
      allRecords = [{

        event_registration_email: 'elihsa@gmail.com',

      }];

    renderColumnConfig();
  } catch (err) {
    console.error('Load email settings error:', err);
    allRecords = [{
      candidate_application_email: 'elihsa@gmail.com',
      venue_partner_email: 'elihsa@gmail.com',
      event_registration_email: 'elihsa@gmail.com',
      send_all_to_same: false,
      global_email: 'elihsa@gmail.com'

    renderTable();
    renderColumnConfig();
  }
}

function updateFilters(schema) {
  statusFilter.innerHTML = '<option value="">All Statuses</option>';
  schema.statusOptions.forEach(status => {
    const opt = document.createElement('option');
    opt.value = status;
    opt.textContent = status.charAt(0).toUpperCase() + status.slice(1);
    statusFilter.appendChild(opt);
  });

  // Update table headers based on visible columns
  const visibleCols = getVisibleColumns(currentTable);
  const headers = schema.allColumns.filter(c => visibleCols.includes(c.key)).map(c => `<th>${c.label}</th>`);
  headers.push('<th>Actions</th>');
  tableHead.innerHTML = '<tr>' + headers.join('') + '</tr>';
}

function updateStats() {
  const schema = tableSchemas[currentTable];
  const stats = { total: 0, undecided: 0, approved: 0, declined: 0, deleted: 0, pending: 0, active: 0, unsubscribed: 0 };

  allRecords.forEach(record => {
    stats.total++;
    const status = record.status || 'undecided';
    if (stats[status] !== undefined) stats[status]++;
  });

  const statCards = statsGrid.querySelectorAll('.stat-card');
  if (currentTable === 'applications') {
    statCards[0].querySelector('h3').textContent = stats.total;
    statCards[0].querySelector('p').textContent = 'Total';
    statCards[1].querySelector('h3').textContent = stats.undecided;
    statCards[1].querySelector('p').textContent = 'Undecided';
    statCards[2].querySelector('h3').textContent = stats.approved;
    statCards[2].querySelector('p').textContent = 'Approved';
    statCards[3].querySelector('h3').textContent = stats.declined;
    statCards[3].querySelector('p').textContent = 'Declined';
    statCards.forEach(c => c.style.display = 'block');
  } else if (currentTable === 'interested_parties') {
    statCards[0].querySelector('h3').textContent = stats.total;
    statCards[0].querySelector('p').textContent = 'Total Registrations';
    statCards[1].querySelector('h3').textContent = stats.pending;
    statCards[1].querySelector('p').textContent = 'Pending';
    statCards[2].style.display = 'none';
    statCards[3].style.display = 'none';
  } else if (currentTable === 'event_organizers') {
    statCards[0].querySelector('h3').textContent = stats.total;
    statCards[0].querySelector('p').textContent = 'Total Applications';
    statCards[1].querySelector('h3').textContent = stats.pending;
    statCards[1].querySelector('p').textContent = 'Pending';
    statCards[2].querySelector('h3').textContent = stats.approved;
    statCards[2].querySelector('p').textContent = 'Approved';
    statCards[3].querySelector('h3').textContent = stats.declined;
    statCards[3].querySelector('p').textContent = 'Declined';
    statCards.forEach(c => c.style.display = 'block');
  } else if (currentTable === 'events') {
    statCards[0].querySelector('h3').textContent = stats.total;
    statCards[0].querySelector('p').textContent = 'Total Events';
    statCards[1].style.display = 'none';
    statCards[2].style.display = 'none';
    statCards[3].style.display = 'none';
  } else if (currentTable === 'event_interest_subscriptions') {
    statCards[0].querySelector('h3').textContent = stats.total;
    statCards[0].querySelector('p').textContent = 'Total Subscriptions';
    statCards[1].querySelector('h3').textContent = stats.active;
    statCards[1].querySelector('p').textContent = 'Active';
    statCards[2].querySelector('h3').textContent = stats.unsubscribed;
    statCards[2].querySelector('p').textContent = 'Unsubscribed';
    statCards[3].style.display = 'none';
  } else if (currentTable === 'email_settings') {
    statCards.forEach(c => c.style.display = 'none');
  }
}

function renderTable() {
  const schema = tableSchemas[currentTable];
  const visibleCols = getVisibleColumns(currentTable);
  let filtered = [...allRecords];

  // Special handling for email_settings - render as a form
  if (currentTable === 'email_settings') {
    renderEmailSettingsForm();
    return;
  }

  // Status filter
  const statusVal = statusFilter.value;
  if (statusVal) filtered = filtered.filter(r => (r.status || 'undecided') === statusVal);

  // Search
  const searchVal = searchInput.value.toLowerCase();
  if (searchVal) {
    filtered = filtered.filter(r =>
      (r.full_name || r.name || '').toLowerCase().includes(searchVal) ||
      (r.email || '').toLowerCase().includes(searchVal) ||
      (r.platform || r.venue_name || r.location || r.description || '').toLowerCase().includes(searchVal)
    );
  }

  // Sort
  const sortVal = sortSelect.value;
  if (sortVal === 'oldest') {
    filtered.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
  } else if (sortVal === 'name') {
    filtered.sort((a, b) => (a.full_name || a.name || '').localeCompare(b.full_name || b.name || ''));
  } else {
    filtered.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  }

  // Render rows
  tableBody.innerHTML = filtered.map(record => {
    const status = record.status || 'undecided';
    const date = record.created_at ? new Date(record.created_at).toLocaleDateString() : 'N/A';

    let cellsHtml = '';
    visibleCols.forEach(colKey => {
      const value = record[colKey];
      if (colKey === 'headshot_url' || colKey === 'fullbody_url' || colKey === 'video_url') {
        if (value) {
          const isVideo = colKey === 'video_url';
          cellsHtml += `<td><${isVideo ? 'video' : 'img'} class="media-thumb" src="${value}" ${isVideo ? 'muted' : ''} onclick="openMediaModal('${value}', ${isVideo})" title="Click to view"></${isVideo ? 'video' : 'img'}></td>`;
        } else {
          cellsHtml += '<td class="empty-cell">—</td>';
        }
      } else if (colKey === 'poster_url') {
        if (value) {
          cellsHtml += `<td><img class="poster-thumb" src="${value}" onclick="openMediaModal('${value}', false)" title="Click to view"></td>`;
        } else {
          cellsHtml += '<td class="empty-cell">No poster</td>';
        }
      } else if (colKey === 'event_id' && value) {
        const event = allRecords.find(e => e.id === value && currentTable === 'events') ||
                      window.eventCache?.find(e => e.id === value);
        cellsHtml += `<td class="event-col">${event?.name || value}</td>`;
      } else if (colKey === 'status') {
        cellsHtml += `<td><span class="status-badge status-${status}">${status}</span></td>`;
      } else if (colKey === 'created_at') {
        cellsHtml += `<td class="date-col">${date}</td>`;
      } else {
        cellsHtml += `<td>${value || '<span class="empty-cell">—</span>'}</td>`;
      }
    });

    // Actions column
    let actionsHtml = '';
    if (schema.hasActions) {
      // For event_interest_subscriptions, use email as the ID (composite key)
      const recordId = currentTable === 'event_interest_subscriptions' ? record.email : record.id;
      actionsHtml = '<div class="action-btns">';
      actionsHtml += `<button class="action-btn btn-view" onclick="viewRecord('${recordId}')">View</button>`;
      if (schema.hasStatus) {
        // Skip edit button for event_interest_subscriptions
        if (currentTable !== 'event_interest_subscriptions') {
          actionsHtml += `<button class="action-btn btn-edit" onclick="editRecord('${recordId}')">Edit</button>`;
        }
        if (currentTable !== 'interested_parties') {
          actionsHtml += `<button class="action-btn btn-approve" onclick="updateStatus('${recordId}', 'approved')" ${status === 'approved' ? 'disabled' : ''}>Approve</button>`;
          actionsHtml += `<button class="action-btn btn-decline" onclick="updateStatus('${recordId}', 'declined')" ${status === 'declined' ? 'disabled' : ''}>Decline</button>`;
          actionsHtml += `<button class="action-btn btn-delete" onclick="updateStatus('${recordId}', 'deleted')" ${status === 'deleted' ? 'disabled' : ''}>Delete</button>`;
        }
      }
      actionsHtml += '</div>';
    }

    return `<tr>${cellsHtml}<td>${actionsHtml}</td></tr>`;
  }).join('');
}

// Save email settings
async function saveEmailSettings() {
  const settings = {
    candidate_application_email: document.getElementById('settings_candidate_application_email')?.value || 'elihsa@gmail.com',
    venue_partner_email: document.getElementById('settings_venue_partner_email')?.value || 'elihsa@gmail.com',
    event_registration_email: document.getElementById('settings_event_registration_email')?.value || 'elihsa@gmail.com',
    send_all_to_same: document.getElementById('settings_send_all_to_same')?.checked || false,
    global_email: document.getElementById('settings_global_email')?.value || 'elihsa@gmail.com'
  };

  // Validate emails
  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  for (const [key, value] of Object.entries(settings)) {
    if (key !== 'send_all_to_same' && value && !emailRegex.test(value)) {
      alert(`Invalid email format for ${key}`);
      return;
    }
  }

  const btn = document.querySelector('.btn-primary');
  btn.textContent = 'Saving...';
  btn.disabled = true;

  try {
    const response = await fetch('/api/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(settings)
    });

    const result = await response.json();

    if (result.status === 'success') {
      alert('Email settings saved successfully!');
      loadData(); // Reload to reflect changes
    } else {
      throw new Error(result.message || 'Failed to save settings');
    }
  } catch (err) {
    alert('Error saving settings: ' + err.message);
    btn.textContent = 'Save Settings';
    btn.disabled = false;
  }
}

// Edit record
function editRecord(id) {
  // Skip edit for email_settings (uses form) and event_interest_subscriptions (composite key)
  if (currentTable === 'email_settings' || currentTable === 'event_interest_subscriptions') {
    return;
  }
  
  const record = allRecords.find(r => r.id === id);
  if (!record) return;
  currentRecordId = id;

  const schema = tableSchemas[currentTable];
  editModalTitle.textContent = `Edit ${schema.title.slice(0, -1)}`;

  let fieldsHtml = '';
  schema.allColumns.forEach(col => {
    if (col.key === 'created_at') return; // Don't edit created_at
    const value = record[col.key] || '';
    if (col.key === 'status') {
      fieldsHtml += `
        <div class="form-group">
          <label>${col.label}</label>
          <select name="${col.key}">
            ${schema.statusOptions.map(s => `<option value="${s}" ${s === value ? 'selected' : ''}>${s.charAt(0).toUpperCase() + s.slice(1)}</option>`).join('')}
          </select>
        </div>
      `;
    } else if (col.key === 'event_id') {
      fieldsHtml += `
        <div class="form-group">
          <label>${col.label}</label>
          <select name="${col.key}">
            <option value="">— Select Event —</option>
            ${eventCache.map(e => `<option value="${e.id}" ${e.id === value ? 'selected' : ''}>${e.name}</option>`).join('')}
          </select>
        </div>
      `;
    } else if (col.key === 'description' || col.key === 'platform') {
      fieldsHtml += `
        <div class="form-group full-width">
          <label>${col.label}</label>
          <textarea name="${col.key}" rows="3">${value}</textarea>
        </div>
      `;
    } else {
      fieldsHtml += `
        <div class="form-group">
          <label>${col.label}</label>
          <input type="text" name="${col.key}" value="${value}" ${col.required ? 'required' : ''}>
        </div>
      `;
    }
  });

  editFormFields.innerHTML = fieldsHtml;
  editModal.classList.add('show');
}

function renderColumnConfig() {
  const schema = tableSchemas[currentTable];
  const visibleCols = getVisibleColumns(currentTable);

  columnList.innerHTML = schema.allColumns.map((col, index) => {
    const isVisible = visibleCols.includes(col.key);
    const isRequired = col.required || false;
    return `
      <div class="column-item" data-key="${col.key}" style="${isRequired ? 'opacity:0.7;' : ''}" draggable="${!isRequired}">
        <span class="drag-handle">⋮⋮</span>
        <input type="checkbox" id="col_${col.key}" ${isVisible ? 'checked' : ''} ${isRequired ? 'disabled' : ''}>
        <label for="col_${col.key}">${col.label}${isRequired ? ' (required)' : ''}</label>
      </div>
    `;
  }).join('');

  // Add event listeners
  columnList.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.addEventListener('change', () => {
      const key = cb.id.replace('col_', '');
      let cols = [...getVisibleColumns(currentTable)];
      if (cb.checked) {
        if (!cols.includes(key)) cols.push(key);
      } else {
        cols = cols.filter(c => c !== key);
      }
      setVisibleColumns(currentTable, cols);
      renderTable();
      renderColumnConfig();
    });
  });

  // Drag and drop for reordering
  let draggedItem = null;
  columnList.querySelectorAll('.column-item').forEach(item => {
    item.addEventListener('dragstart', (e) => {
      if (item.querySelector('input').disabled) return;
      draggedItem = item;
      item.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    item.addEventListener('dragend', () => {
      item.classList.remove('dragging');
      draggedItem = null;
    });
    item.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      if (draggedItem && draggedItem !== item) {
        const rect = item.getBoundingClientRect();
        const midY = rect.top + rect.height / 2;
        if (e.clientY < midY) {
          item.parentNode.insertBefore(draggedItem, item);
        } else {
          item.parentNode.insertBefore(draggedItem, item.nextSibling);
        }
      }
    });
    item.addEventListener('drop', (e) => {
      e.preventDefault();
      // Update column order
      const items = [...columnList.querySelectorAll('.column-item:not(.dragging)')];
      const newOrder = items.map(i => i.dataset.key).filter(k => k);
      setVisibleColumns(currentTable, newOrder);
      renderTable();
      renderColumnConfig();
    });
  });
}
