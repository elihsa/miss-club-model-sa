<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - Miss Club Model SA</title>
<style>
  :root {
    --gold: #c9a84c;
    --gold-light: #f0d878;
    --gold-dark: #8b6914;
    --black: #0a0a0a;
    --dark: #1a1a1a;
    --cream: #f5f0e8;
    --red: #e74c3c;
    --green: #27ae60;
    --orange: #f39c12;
    --blue: #3498db;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Georgia', serif;
    background: var(--black);
    color: var(--cream);
    line-height: 1.6;
    min-height: 100vh;
  }
  /* NAV */
  nav {
    position: fixed; top: 0; width: 100%; z-index: 1000;
    background: rgba(10,10,10,0.95);
    border-bottom: 2px solid var(--gold);
    padding: 15px 40px;
    display: flex; justify-content: space-between; align-items: center;
  }
  nav .logo-text { font-size: 1.4rem; color: var(--gold); font-weight: bold; letter-spacing: 2px; }
  nav a { color: var(--cream); text-decoration: none; font-size: 0.95rem; transition: color 0.3s; margin-left: 20px; }
  nav a:hover { color: var(--gold); }
  .btn-logout {
    background: var(--red); color: var(--cream); border: none; padding: 8px 16px;
    border-radius: 4px; cursor: pointer; font-family: inherit;
  }
  .btn-logout:hover { background: #c0392b; }

  /* MAIN */
  main { padding: 100px 40px 60px; max-width: 1400px; margin: 0 auto; }
  h1 { color: var(--gold); margin-bottom: 30px; letter-spacing: 2px; }
  h1::after { content: ''; display: block; width: 80px; height: 3px; background: var(--gold); margin: 15px 0 0; }

  /* STATS */
  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 40px; }
  .stat-card { background: var(--dark); border: 1px solid var(--gold-dark); border-radius: 8px; padding: 25px; text-align: center; }
  .stat-card h3 { color: var(--gold); font-size: 2.5rem; margin-bottom: 5px; }
  .stat-card p { color: #aaa; font-size: 0.9rem; }

  /* FILTERS */
  .filters { display: flex; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; align-items: center; }
  .filter-select, .filter-input {
    padding: 10px 15px; background: var(--dark); border: 1px solid var(--gold-dark);
    border-radius: 6px; color: var(--cream); font-family: inherit; font-size: 0.95rem;
  }
  .filter-select:focus, .filter-input:focus { outline: none; border-color: var(--gold); }

  /* TABLE */
  .table-container { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; background: var(--dark); border: 1px solid var(--gold-dark); border-radius: 8px; overflow: hidden; }
  th, td { padding: 15px; text-align: left; border-bottom: 1px solid var(--gold-dark); }
  th { background: var(--black); color: var(--gold); font-weight: bold; letter-spacing: 1px; font-size: 0.85rem; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(201,168,76,0.05); }
  .status-badge {
    display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; text-transform: uppercase;
  }
  .status-undecided { background: var(--orange); color: var(--black); }
  .status-approved { background: var(--green); color: var(--black); }
  .status-declined { background: var(--red); color: var(--cream); }
  .status-deleted { background: #555; color: #aaa; text-decoration: line-through; }
  .action-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .action-btn { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.8rem; font-weight: bold; transition: all 0.2s; }
  .btn-approve { background: var(--green); color: var(--black); }
  .btn-decline { background: var(--orange); color: var(--black); }
  .btn-delete { background: var(--red); color: var(--cream); }
  .action-btn:hover { opacity: 0.8; transform: translateY(-1px); }
  .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .applicant-name { font-weight: bold; color: var(--gold); }
  .applicant-email { color: #aaa; font-size: 0.85rem; }
  .applicant-platform { max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #ccc; font-size: 0.85rem; }
  .media-links a { color: var(--gold-light); text-decoration: none; margin-right: 10px; font-size: 0.8rem; }
  .media-links a:hover { text-decoration: underline; }
  .date-col { color: #888; font-size: 0.8rem; white-space: nowrap; }

  /* LOGIN */
  .login-container { max-width: 400px; margin: 80px auto; padding: 40px; background: var(--dark); border: 1px solid var(--gold-dark); border-radius: 12px; text-align: center; }
  .login-container h2 { color: var(--gold); margin-bottom: 10px; }
  .login-container p { color: #aaa; margin-bottom: 30px; }
  .form-group { margin-bottom: 20px; text-align: left; }
  .form-group label { display: block; color: var(--gold); margin-bottom: 6px; font-size: 0.95rem; font-weight: bold; }
  .form-group input { width: 100%; padding: 12px 15px; background: var(--black); border: 1px solid #444; color: var(--cream); border-radius: 6px; font-size: 1rem; font-family: 'Georgia', serif; }
  .form-group input:focus { outline: none; border-color: var(--gold); }
  .login-btn { width: 100%; padding: 14px; background: var(--gold); color: var(--black); border: none; border-radius: 6px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: all 0.3s; }
  .login-btn:hover { background: var(--gold-light); }
  .error-msg { color: var(--red); margin-top: 15px; display: none; }
  .error-msg.show { display: block; }

  /* MODAL */
  .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; align-items: center; justify-content: center; }
  .modal.show { display: flex; }
  .modal-content { background: var(--dark); border: 2px solid var(--gold); border-radius: 12px; padding: 30px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; }
  .modal-content h3 { color: var(--gold); margin-bottom: 20px; }
  .modal-row { display: grid; grid-template-columns: 150px 1fr; gap: 10px; margin-bottom: 12px; font-size: 0.9rem; }
  .modal-label { color: var(--gold); font-weight: bold; }
  .modal-value { color: #ccc; word-break: break-word; }
  .modal-media a { display: inline-block; margin: 5px 10px 5px 0; color: var(--gold-light); text-decoration: none; font-size: 0.85rem; }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }
  .modal-close { background: transparent; color: var(--cream); border: 1px solid var(--gold-dark); padding: 10px 20px; border-radius: 4px; cursor: pointer; }

  /* RESPONSIVE */
  @media (max-width: 768px) {
    nav { padding: 15px 20px; }
    main { padding: 100px 20px 40px; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    th, td { padding: 10px 8px; font-size: 0.8rem; }
    .action-btns { flex-direction: column; }
    .modal-row { grid-template-columns: 1fr; }
    .modal-label { border-bottom: 1px solid var(--gold-dark); padding-bottom: 5px; margin-bottom: 5px; }
  }
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <div class="logo-text">Miss Club Model SA - Admin</div>
  <div>
    <a href="/">View Site</a>
    <button class="btn-logout" id="logoutBtn" style="display:none">Logout</button>
  </div>
</nav>

<!-- LOGIN VIEW -->
<div id="loginView" class="login-container">
  <h2>Admin Login</h2>
  <p>Sign in to manage candidate applications</p>
  <form id="loginForm">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="loginEmail" required placeholder="admin@missclubmodelsa.co.za">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPassword" required placeholder="••••••••">
    </div>
    <button type="submit" class="login-btn">Sign In</button>
    <div class="error-msg" id="loginError"></div>
  </form>
</div>

<!-- DASHBOARD VIEW (hidden until login) -->
<div id="dashboardView" style="display:none">
  <h1>Applications Dashboard</h1>

  <!-- STATS -->
  <div class="stats-grid">
    <div class="stat-card"><h3 id="statTotal">0</h3><p>Total Applications</p></div>
    <div class="stat-card"><h3 id="statUndecided">0</h3><p>Undecided</p></div>
    <div class="stat-card"><h3 id="statApproved">0</h3><p>Approved</p></div>
    <div class="stat-card"><h3 id="statDeclined">0</h3><p>Declined</p></div>
  </div>

  <!-- FILTERS -->
  <div class="filters">
    <select class="filter-select" id="statusFilter">
      <option value="">All Statuses</option>
      <option value="undecided">Undecided</option>
      <option value="approved">Approved</option>
      <option value="declined">Declined</option>
      <option value="deleted">Deleted</option>
    </select>
    <input type="text" class="filter-input" id="searchInput" placeholder="Search name, email, platform...">
    <select class="filter-select" id="sortSelect">
      <option value="newest">Newest First</option>
      <option value="oldest">Oldest First</option>
      <option value="name">Name A-Z</option>
    </select>
  </div>

  <!-- TABLE -->
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Applicant</th>
          <th>Platform / Advocacy</th>
          <th>Status</th>
          <th>Media</th>
          <th>Date</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="applicationsTable">
      </tbody>
    </table>
  </div>
</div>

<!-- DETAIL MODAL -->
<div class="modal" id="detailModal">
  <div class="modal-content">
    <h3>Application Details</h3>
    <div id="modalBody"></div>
    <div class="modal-actions">
      <button class="modal-close" id="modalClose">Close</button>
    </div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://ekvwgxnryasrvltyukvj.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_ePDDXlwk-BhljlqNhink-w_ZEzsJ6ZR';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Admin emails allowed (add yours)
const ADMIN_EMAILS = ['elihsa@gmail.com', 'admin@missclubmodelsa.co.za','kiyanoschoonraad98@gmail.com'; // Add your email here

let allApplications = [];

// DOM Elements
const loginView = document.getElementById('loginView');
const dashboardView = document.getElementById('dashboardView');
const logoutBtn = document.getElementById('logoutBtn');
const loginForm = document.getElementById('loginForm');
const loginError = document.getElementById('loginError');
const applicationsTable = document.getElementById('applicationsTable');
const statusFilter = document.getElementById('statusFilter');
const searchInput = document.getElementById('searchInput');
const sortSelect = document.getElementById('sortSelect');
const detailModal = document.getElementById('detailModal');
const modalBody = document.getElementById('modalBody');
const modalClose = document.getElementById('modalClose');

// Check session on load
async function checkSession() {
  const { data: { session } } = await supabase.auth.getSession();
  if (session && ADMIN_EMAILS.includes(session.user.email)) {
    showDashboard();
    loadApplications();
  } else {
    showLogin();
  }
}

// Auth state listener
supabase.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_IN' && session && ADMIN_EMAILS.includes(session.user.email)) {
    showDashboard();
    loadApplications();
  } else if (event === 'SIGNED_OUT') {
    showLogin();
  }
});

// Login
loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  
  if (!ADMIN_EMAILS.includes(email)) {
    loginError.textContent = 'Unauthorized email';
    loginError.classList.add('show');
    return;
  }
  
  const { error } = await supabase.auth.signInWithPassword({ email, password });
  if (error) {
    loginError.textContent = error.message;
    loginError.classList.add('show');
  } else {
    loginError.classList.remove('show');
  }
});

// Logout
logoutBtn.addEventListener('click', async () => {
  await supabase.auth.signOut();
  showLogin();
});

function showLogin() {
  loginView.style.display = 'block';
  dashboardView.style.display = 'none';
  logoutBtn.style.display = 'none';
}

function showDashboard() {
  loginView.style.display = 'none';
  dashboardView.style.display = 'block';
  logoutBtn.style.display = 'block';
}

// Load applications
async function loadApplications() {
  const { data, error } = await supabase
    .from('applications')
    .select('*')
    .order('created_at', { ascending: false });
  
  if (error) {
    console.error('Load error:', error);
    return;
  }
  
  allApplications = data || [];
  updateStats();
  renderTable();
}

// Update stats
function updateStats() {
  const stats = { total: 0, undecided: 0, approved: 0, declined: 0, deleted: 0 };
  allApplications.forEach(app => {
    stats.total++;
    const status = app.status || 'undecided';
    if (stats[status] !== undefined) stats[status]++;
  });
  document.getElementById('statTotal').textContent = stats.total;
  document.getElementById('statUndecided').textContent = stats.undecided;
  document.getElementById('statApproved').textContent = stats.approved;
  document.getElementById('statDeclined').textContent = stats.declined;
}

// Render table
function renderTable() {
  let filtered = [...allApplications];
  
  // Status filter
  const statusVal = statusFilter.value;
  if (statusVal) filtered = filtered.filter(a => (a.status || 'undecided') === statusVal);
  
  // Search
  const searchVal = searchInput.value.toLowerCase();
  if (searchVal) {
    filtered = filtered.filter(a => 
      (a.full_name || '').toLowerCase().includes(searchVal) ||
      (a.email || '').toLowerCase().includes(searchVal) ||
      (a.platform || '').toLowerCase().includes(searchVal)
    );
  }
  
  // Sort
  const sortVal = sortSelect.value;
  if (sortVal === 'oldest') filtered.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
  else if (sortVal === 'name') filtered.sort((a, b) => (a.full_name || '').localeCompare(b.full_name || ''));
  else filtered.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  
  applicationsTable.innerHTML = filtered.map(app => `
    <tr data-id="${app.id}">
      <td>
        <div class="applicant-name">${app.full_name || 'Unknown'}</div>
        <div class="applicant-email">${app.email || ''}</div>
      </td>
      <td class="applicant-platform" title="${app.platform || ''}">${app.platform || ''}</td>
      <td><span class="status-badge status-${app.status || 'undecided'}">${(app.status || 'undecided').charAt(0).toUpperCase() + (app.status || 'undecided').slice(1)}</span></td>
      <td class="media-links">
        ${app.headshot_url ? `<a href="${app.headshot_url}" target="_blank">📷 Headshot</a>` : ''}
        ${app.fullbody_url ? `<a href="${app.fullbody_url}" target="_blank">📷 Full-body</a>` : ''}
        ${app.video_url ? `<a href="${app.video_url}" target="_blank">🎥 Video</a>` : ''}
      </td>
      <td class="date-col">${app.created_at ? new Date(app.created_at).toLocaleDateString() : ''}</td>
      <td>
        <div class="action-btns">
          ${(app.status || 'undecided') !== 'approved' ? `<button class="action-btn btn-approve" onclick="updateStatus('${app.id}', 'approved')">Approve</button>` : ''}
          ${(app.status || 'undecided') !== 'declined' ? `<button class="action-btn btn-decline" onclick="updateStatus('${app.id}', 'declined')">Decline</button>` : ''}
          ${(app.status || 'undecided') !== 'deleted' ? `<button class="action-btn btn-delete" onclick="updateStatus('${app.id}', 'deleted')">Delete</button>` : ''}
          <button class="action-btn" style="background: var(--blue); color: var(--cream);" onclick="viewDetails('${app.id}')">View</button>
        </div>
      </td>
    </tr>
  `).join('');
}

// Filter/sort listeners
statusFilter.addEventListener('change', renderTable);
searchInput.addEventListener('input', renderTable);
sortSelect.addEventListener('change', renderTable);

// Update status
window.updateStatus = async function(id, status) {
  const btn = event.target;
  btn.disabled = true;
  btn.textContent = 'Saving...';
  
  const { error } = await supabase
    .from('applications')
    .update({ status })
    .eq('id', id);
  
  if (error) {
    alert('Error: ' + error.message);
    btn.disabled = false;
    btn.textContent = status.charAt(0).toUpperCase() + status.slice(1);
  } else {
    const app = allApplications.find(a => a.id === id);
    if (app) app.status = status;
    updateStats();
    renderTable();
  }
};

// View details
window.viewDetails = async function(id) {
  const app = allApplications.find(a => a.id === id);
  if (!app) return;
  
  modalBody.innerHTML = `
    <div class="modal-row"><span class="modal-label">Full Name:</span><span class="modal-value">${app.full_name || ''}</span></div>
    <div class="modal-row"><span class="modal-label">Email:</span><span class="modal-value">${app.email || ''}</span></div>
    <div class="modal-row"><span class="modal-label">Phone:</span><span class="modal-value">${app.phone || ''}</span></div>
    <div class="modal-row"><span class="modal-label">Address:</span><span class="modal-value">${app.address || ''}</span></div>
    <div class="modal-row"><span class="modal-label">City:</span><span class="modal-value">${app.city || ''}</span></div>
    <div class="modal-row"><span class="modal-label">Province:</span><span class="modal-value">${app.province || ''}</span></div>
    <div class="modal-row"><span class="modal-label">DOB:</span><span class="modal-value">${app.dob || ''}</span></div>
    <div class="modal-row"><span class="modal-label">Height:</span><span class="modal-value">${app.height ? app.height + ' cm' : ''}</span></div>
    <div class="modal-row"><span class="modal-label">Occupation:</span><span class="modal-value">${app.occupation || ''}</span></div>
    <div class="modal-row"><span class="modal-label">Education:</span><span class="modal-value">${app.education || ''}</span></div>
    <div class="modal-row"><span class="modal-label">Instagram:</span><span class="modal-value">${app.instagram || ''}</span></div>
    <div class="modal-row"><span class="modal-label">Platform:</span><span class="modal-value">${app.platform || ''}</span></div>
    <div class="modal-row"><span class="modal-label">Essay:</span><span class="modal-value">${app.essay || ''}</span></div>
    <div class="modal-row"><span class="modal-label">Talent:</span><span class="modal-value">${app.talent || ''}</span></div>
    <div class="modal-row"><span class="modal-label">Emergency Contact:</span><span class="modal-value">${app.emergency_name || ''} - ${app.emergency_phone || ''}</span></div>
    <div class="modal-row"><span class="modal-label">Terms:</span><span class="modal-value">${app.terms ? 'Yes' : 'No'}</span></div>
    <div class="modal-row"><span class="modal-label">Media Release:</span><span class="modal-value">${app.media_release ? 'Yes' : 'No'}</span></div>
    <div class="modal-row"><span class="modal-label">Status:</span><span class="modal-value"><span class="status-badge status-${app.status || 'undecided'}">${(app.status || 'undecided').charAt(0).toUpperCase() + (app.status || 'undecided').slice(1)}</span></span></div>
    <div class="modal-row"><span class="modal-label">Applied:</span><span class="modal-value">${app.created_at ? new Date(app.created_at).toLocaleString() : ''}</span></div>
    <div class="modal-media">
      ${app.headshot_url ? `<a href="${app.headshot_url}" target="_blank">📷 Headshot</a>` : ''}
      ${app.fullbody_url ? `<a href="${app.fullbody_url}" target="_blank">📷 Full-body</a>` : ''}
      ${app.video_url ? `<a href="${app.video_url}" target="_blank">🎥 Video</a>` : ''}
    </div>
  `;
  detailModal.classList.add('show');
};

modalClose.addEventListener('click', () => detailModal.classList.remove('show'));
detailModal.addEventListener('click', (e) => { if (e.target === detailModal) detailModal.classList.remove('show'); });

// Init
checkSession();
</script>
</body>
</html>
