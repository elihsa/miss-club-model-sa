# Miss Club Model SA — GitHub Actions CI/CD Pipeline
# Generated by appcheck Step 14 — DO NOT EDIT DIRECTLY
# To regenerate: run appcheck with --generate-ci flag
# Merge this file into .github/workflows/appcheck.yml after review

name: appcheck — Full Master Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}

env:
  NODE_VERSION: '26'
  PLAYWRIGHT_BASE_URL: http://localhost:3000

jobs:
  # ============================================================
  # JOB 1: Pre-Flight Gates (Steps 0-12)
  # ============================================================
  preflight:
    name: Pre-Flight Gates (Steps 0-12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Cache Incremental Check (Step 0)
        id: cache_check
        run: |
          echo "🔍 Step 0: Incremental Cache Validation"
          # Hash manifests to detect changes
          SHA=$(cat package-lock.json vercel.json .env.example 2>/dev/null | sha256sum | cut -d' ' -f1)
          echo "manifest_hash=$SHA" >> $GITHUB_OUTPUT
          if [ -f .appcheck/last_hash.txt ] && [ "$(cat .appcheck/last_hash.txt)" = "$SHA" ]; then
            echo "cache_hit=true" >> $GITHUB_OUTPUT
            echo "✅ Cache HIT — skipping to Step 13"
          else
            echo "cache_hit=false" >> $GITHUB_OUTPUT
            echo "❌ Cache MISS — running full pipeline"
            echo "$SHA" > .appcheck/last_hash.txt
          fi

      - name: Dependency Scan & Compatibility (Step 1)
        if: steps.cache_check.outputs.cache_hit != 'true'
        run: |
          echo "🔍 Step 1: Dependency Manifest Scan"
          npm ls --all 2>&1 | head -30
          # Check for conflicts
          npx npm-check-updates --configFileString '{"filter": "/", "reject": ["major"]}' 2>&1 || true

      - name: System Runtime Detection (Step 2)
        if: steps.cache_check.outputs.cache_hit != 'true'
        run: |
          echo "🔍 Step 2: System Detection"
          echo "OS: $(uname -a)"
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "Python: $(python3 --version)"

      - name: Fetcher & Silent Failure Prevention (Step 3)
        if: steps.cache_check.outputs.cache_hit != 'true'
        run: |
          echo "🔍 Step 3: Fetcher & Verifier"
          # Verify all packages imported successfully
          node -e "
            const deps = require('./package.json');
            const all = {...deps.dependencies, ...deps.devDependencies};
            for (const [name] of Object.entries(all)) {
              try { require.resolve(name); console.log('✅', name); }
              catch (e) { console.log('❌', name, e.message); process.exit(1); }
            }
          "

      - name: Syntax & Lint Gate (Step 4)
        if: steps.cache_check.outputs.cache_hit != 'true'
        run: |
          echo "🔍 Step 4: Syntax & Lint"
          npx eslint scripts/**/*.js api/**/*.js
          # Also verify JS syntax
          node --check api/admin.js
          node --check api/events.js
          node --check api/submit.js
          node --check api/upload.js

      - name: Environment Validation (Step 5)
        if: steps.cache_check.outputs.cache_hit != 'true'
        run: |
          echo "🔍 Step 5: Environment Validation"
          # Check .env.example exists
          test -f .env.example && echo "✅ .env.example present" || echo "⚠️ .env.example missing"
          # Check for required vars pattern in code
          grep -r "process.env\." --include="*.js" api/ | grep -o "process.env\.[A-Z_]*" | sort -u | sed 's/process.env.//' | while read var; do
            echo "Required: $var"
          done

      - name: Backend Service Probing (Step 6)
        if: steps.cache_check.outputs.cache_hit != 'true'
        run: |
          echo "🔍 Step 6: Backend Probing"
          # Supabase connectivity
          if [ -n "$SUPABASE_URL" ]; then
            curl -s -o /dev/null -w "%{http_code}" "$SUPABASE_URL" | grep -q "200\|301\|302" && echo "✅ Supabase reachable" || echo "❌ Supabase unreachable"
          else
            echo "⚠️ SUPABASE_URL not set — skipping"
          fi

      - name: Form E2E Scaffolding (Step 7)
        if: steps.cache_check.outputs.cache_hit != 'true'
        run: |
          echo "🔍 Step 7: Form E2E"
          echo "API endpoints found: $(ls api/*.js | wc -l)"
          # Verify all API files have CORS and error handling
          for f in api/*.js; do
            grep -q "Access-Control-Allow-Origin" "$f" && echo "✅ $f: CORS" || echo "❌ $f: MISSING CORS"
            grep -q "try {" "$f" && echo "✅ $f: error handling" || echo "❌ $f: MISSING try/catch"
          done

      - name: Frontend Validation (Step 8)
        if: steps.cache_check.outputs.cache_hit != 'true'
        run: |
          echo "🔍 Step 8: Frontend HTML/CSS/JS"
          # Basic HTML validation
          for f in *.html; do
            # Check for basic structure
            grep -q "<!DOCTYPE html>" "$f" && echo "✅ $f: DOCTYPE" || echo "❌ $f: MISSING DOCTYPE"
            grep -q "<html" "$f" && echo "✅ $f: html tag" || echo "❌ $f: MISSING html"
            grep -q "</html>" "$f" && echo "✅ $f: closing html" || echo "❌ $f: MISSING closing html"
          done

      - name: Template Engine Check (Step 9)
        if: steps.cache_check.outputs.cache_hit != 'true'
        run: |
          echo "🔍 Step 9: Template Engine"
          if grep -r '{%' *.html 2>/dev/null | grep -v node_modules; then
            echo "⚠️ Jinja2/Django templates detected — manual verification needed"
          else
            echo "✅ No template engines detected (static HTML)"
          fi

      - name: Static Asset Compilation (Step 10)
        if: steps.cache_check.outputs.cache_hit != 'true'
        run: |
          echo "🔍 Step 10: Static Assets"
          if [ -f "package.json" ] && grep -q '"build"' package.json; then
            npm run build 2>&1 | tail -10
          else
            echo "ℹ️ No build script — static assets only"
            ls -la assets/ 2>/dev/null || echo "No assets dir"
          fi

      - name: Port & Timezone Audit (Step 11)
        if: steps.cache_check.outputs.cache_hit != 'true'
        run: |
          echo "🔍 Step 11: Port & Timezone"
          # Check common ports
          for port in 3000 4000 5000 8080 8765 2283; do
            ss -tln 2>/dev/null | grep -q ":$port " && echo "⚠️ Port $port in use" || echo "✅ Port $port free"
          done
          echo "TZ: ${TZ:-UTC}"
          echo "LC_ALL: ${LC_ALL:-not set}"

      - name: Security Headers & CORS Audit (Step 12)
        if: steps.cache_check.outputs.cache_hit != 'true'
        run: |
          echo "🔍 Step 12: Security & CORS"
          # Check CORS headers
          for f in api/*.js; do
            if grep -q "Access-Control-Allow-Origin.*\*" "$f"; then
              echo "⚠️ $f: CORS set to * (overly permissive)"
            elif grep -q "Access-Control-Allow-Origin" "$f"; then
              echo "✅ $f: CORS restricted"
            else
              echo "❌ $f: NO CORS header"
            fi
          done
          # Check for security headers in Vercel config
          if [ -f "vercel.json" ]; then
            grep -q "headers" vercel.json && echo "✅ Vercel headers configured" || echo "⚠️ No Vercel headers config"
          fi

  # ============================================================
  # JOB 2: Playwright E2E Tests (Run after Pre-Flight)
  # ============================================================
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.result == 'success'
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Start local dev server
        run: |
          npm run dev &
          sleep 10
          curl -f http://localhost:3000 || exit 1

      - name: Run Playwright E2E Tests
        run: npx playwright test --reporter=html

      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ============================================================
  # JOB 3: Visual Regression (Run after E2E)
  # ============================================================
  visual-regression:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    needs: e2e
    if: needs.e2e.result == 'success'
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Visual Regression Tests
        run: npx playwright test tests/e2e/visual_regression.spec.ts --reporter=list

      - name: Upload Visual Regression Snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-snapshots
          path: tests/e2e/visual_regression.spec.ts-snapshots/
          retention-days: 7

  # ============================================================
  # JOB 4: Post-Gate Automation (Steps 13-15)
  # ============================================================
  post-gate:
    name: Post-Gate Automation (Steps 13-15)
    runs-on: ubuntu-latest
    needs: [preflight, e2e, visual-regression]
    if: always()
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Step 13 — Visual Regression Baseline Summary
        if: needs.visual-regression.result == 'success'
        run: |
          echo "✅ Step 13: Visual Regression baselines generated"
          echo "Snapshots stored in tests/e2e/visual_regression.spec.ts-snapshots/"

      - name: Step 14 — CI/CD Pipeline
        run: |
          echo "✅ Step 14: CI/CD Pipeline generated"
          echo "This workflow IS the generated pipeline."
          echo "To regenerate: run 'appcheck --generate-ci' locally"

      - name: Step 15 — Pre-Commit Hook (Local Only)
        run: |
          echo "ℹ️ Step 15: Pre-Commit Hook"
          echo "Pre-commit hooks must be installed locally by developers:"
          echo "  appcheck --install-hooks"
          echo "This installs .git/hooks/pre-commit running fast gates (Steps 1, 4, 5, 11)."