<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - Miss Club Model SA</title>
<style>
  :root {
    --gold: #c9a84c; --gold-light: #f0d878; --gold-dark: #8b6914;
    --black: #0a0a0a; --dark: #1a1a1a; --cream: #f5f0e8;
    --red: #e74c3c; --green: #27ae60;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', 'Segoe UI', sans-serif;
    background: var(--black); color: var(--cream);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .card {
    background: var(--dark); border: 1px solid var(--gold-dark);
    border-radius: 12px; padding: 40px; width: 100%; max-width: 420px; margin: 20px;
  }
  h1 { color: var(--gold); font-size: 1.5rem; margin-bottom: 8px; letter-spacing: 1px; }
  p.sub { color: #999; font-size: 0.9rem; margin-bottom: 24px; }
  .form-group { margin-bottom: 18px; }
  label { display: block; font-size: 0.85rem; color: var(--gold); margin-bottom: 6px; }
  input {
    width: 100%; padding: 12px; border-radius: 6px; border: 1px solid var(--gold-dark);
    background: var(--black); color: var(--cream); font-size: 1rem;
  }
  input:focus { outline: none; border-color: var(--gold); }
  .btn {
    width: 100%; padding: 14px; background: var(--gold); color: var(--black);
    border: none; border-radius: 6px; font-size: 1.05rem; font-weight: 600;
    cursor: pointer; transition: all 0.3s;
  }
  .btn:hover { background: var(--gold-light); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .error-msg { color: var(--red); font-size: 0.9rem; margin-top: 12px; min-height: 20px; }
  .success-msg { color: var(--green); font-size: 0.95rem; margin-top: 12px; }
  a { color: var(--gold); text-decoration: none; font-size: 0.9rem; display: block; text-align: center; margin-top: 16px; }
  a:hover { text-decoration: underline; }
  .bad-link {
    background: var(--dark); border: 1px solid var(--red); border-radius: 12px;
    padding: 32px; max-width: 460px; margin: 20px; text-align: center;
  }
  .bad-link h2 { color: var(--red); margin-bottom: 12px; }
  .bad-link p { color: #ccc; font-size: 0.95rem; }
</style>
</head>
<body>
<div class="card" id="resetCard" style="display:none">
  <h1>Set New Password</h1>
  <p class="sub">Choose a new password for your admin account.</p>
  <form id="resetForm">
    <div class="form-group">
      <label>New Password</label>
      <input type="password" id="newPassword" required minlength="8" placeholder="At least 8 characters">
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="confirmPassword" required minlength="8" placeholder="Re-enter new password">
    </div>
    <button type="submit" class="btn" id="resetBtn">Update Password</button>
    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg" style="display:none"></div>
    <a href="/admin.html">Back to Admin Login</a>
  </form>
</div>

<div class="bad-link" id="badLink" style="display:none">
  <h2>Invalid or Expired Link</h2>
  <p>This password reset link is invalid or has expired. Please request a new one from the admin login page.</p>
  <a href="/admin.html" style="margin-top:20px;">Go to Admin Login</a>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  const SUPABASE_URL = 'https://ekvwgxnryasrvltyukvj.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_ePDDXlwk-BhljlqNhink-w_ZEzsJ6ZR';
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  window.supabase = supabase;

  const resetCard = document.getElementById('resetCard');
  const badLink = document.getElementById('badLink');
  const form = document.getElementById('resetForm');
  const newPw = document.getElementById('newPassword');
  const confirmPw = document.getElementById('confirmPassword');
  const resetBtn = document.getElementById('resetBtn');
  const errorMsg = document.getElementById('errorMsg');
  const successMsg = document.getElementById('successMsg');

  async function init() {
    const { data: { session }, error } = await supabase.auth.getSession();
    if (error) {
      console.error('Session error:', error.message);
      badLink.style.display = 'block';
      return;
    }
    if (session) {
      resetCard.style.display = 'block';
    } else {
      // Try to recover session from URL hash (Supabase puts tokens in #access_token=...)
      const hash = window.location.hash;
      if (hash && hash.includes('access_token')) {
        const { data: { session: s2 }, error: e2 } = await supabase.auth.setSession({
          access_token: new URLSearchParams(hash.substring(1)).get('access_token'),
          refresh_token: new URLSearchParams(hash.substring(1)).get('refresh_token')
        });
        if (s2 && !e2) {
          resetCard.style.display = 'block';
        } else {
          badLink.style.display = 'block';
        }
      } else {
        badLink.style.display = 'block';
      }
    }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.textContent = '';
    successMsg.style.display = 'none';

    if (newPw.value.length < 8) {
      errorMsg.textContent = 'Password must be at least 8 characters.';
      return;
    }
    if (newPw.value !== confirmPw.value) {
      errorMsg.textContent = 'Passwords do not match.';
      return;
    }

    resetBtn.disabled = true;
    resetBtn.textContent = 'Updating...';

    try {
      const { error } = await supabase.auth.updateUser({ password: newPw.value });
      if (error) throw error;
      successMsg.style.display = 'block';
      successMsg.textContent = 'Password updated successfully! Redirecting to login...';
      setTimeout(() => { window.location.href = '/admin.html'; }, 2000);
    } catch (err) {
      errorMsg.textContent = 'Error: ' + err.message;
      resetBtn.disabled = false;
      resetBtn.textContent = 'Update Password';
    }
  });

  init();
</script>
</body>
</html>
